# Actions tab > "3. Sync now" > Run workflow.
# Fetches every page's latest posts and follower count once (about $0.10). Use it after the
# backfill if a page shows no follower count.
name: 3. Sync now
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/sync.ts --force
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APIFY_MONTHLY_BUDGET_USD: "9"
